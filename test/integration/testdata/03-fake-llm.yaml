---
# Fake LLM server — deployed into tc-test so the caller pod can reach it on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-llm
  namespace: tc-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-llm
  template:
    metadata:
      labels:
        app: fake-llm
    spec:
      containers:
        - name: fake-llm
          image: fake-llm:test     # loaded into kind by the Makefile
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: fake-llm
  namespace: tc-test
spec:
  selector:
    app: fake-llm
  ports:
    - port: 8080
      targetPort: 8080
