---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: tokenpolicies.governance.tokencontrol.io
spec:
  group: governance.tokencontrol.io
  names:
    categories:
    - governance
    - llm
    kind: TokenPolicy
    listKind: TokenPolicyList
    plural: tokenpolicies
    shortNames:
    - tp
    singular: tokenpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.selector
      name: Scope
      priority: 1
      type: string
    - jsonPath: .spec.enforcement
      name: Enforcement
      type: string
    - jsonPath: .status.effectiveQuota.tokensPerMinute
      name: TPM
      type: integer
    - jsonPath: .status.usage.tokensMinute
      name: Used(min)
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TokenPolicy is the Schema for namespace- and workload-scoped
          LLM governance.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TokenPolicySpec defines namespace- or workload-scoped LLM governance. A TokenPolicy
              with an empty Selector is the namespace default; one with a Selector targets specific
              workloads and may only further constrain (never widen) the namespace default and the
              applicable ClusterTokenPolicies.
            properties:
              enforcement:
                description: |-
                  Enforcement overrides the inherited enforcement mode for the targeted scope. When empty,
                  the mode is inherited from the applicable ClusterTokenPolicy (default Enforce).
                enum:
                - Enforce
                - Audit
                - Disabled
                type: string
              gateway:
                description: Gateway overrides the inherited downstream gateway integration
                  for this scope.
                properties:
                  targetRef:
                    description: TargetRef identifies the gateway route/backend to
                      which generated policy attaches.
                    properties:
                      group:
                        description: Group of the target, e.g. "gateway.networking.k8s.io"
                          or "aigateway.envoyproxy.io".
                        type: string
                      kind:
                        description: Kind of the target, e.g. "HTTPRoute", "AIGatewayRoute".
                        minLength: 1
                        type: string
                      name:
                        description: Name of the target object.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the target. Defaults to the policy
                          namespace for namespaced policies.
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  type:
                    default: None
                    description: Type selects the gateway flavor. Defaults to None.
                    enum:
                    - None
                    - EnvoyAIGateway
                    - Kuadrant
                    type: string
                type: object
              models:
                description: |-
                  Models is the model allowlist for the targeted scope. Each Allow must be permitted by
                  the namespace default and by the applicable ClusterTokenPolicies; the validating
                  webhook rejects rules that attempt to widen the inherited permission set.
                items:
                  description: |-
                    ModelPermission declares a provider/model combination and whether it is permitted.
                    Model supports glob patterns ("gpt-4o-*", "*"). Deny rules always win over Allow
                    rules at the same or a broader scope.
                  properties:
                    action:
                      default: Allow
                      description: Action is whether to Allow or Deny this provider/model.
                        Defaults to Allow.
                      enum:
                      - Allow
                      - Deny
                      type: string
                    credentialRef:
                      description: |-
                        CredentialRef binds a specific ModelCredential to this permission. When set, the
                        mutating webhook injects that credential for workloads using this model.
                      properties:
                        name:
                          description: Name of the ModelCredential.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    model:
                      description: Model is a model name or glob pattern, e.g. "gpt-4",
                        "gpt-4o-*", "*".
                      maxLength: 253
                      minLength: 1
                      type: string
                    provider:
                      description: Provider is the LLM provider identifier, e.g. "openai",
                        "anthropic", "bedrock", "vertex".
                      maxLength: 63
                      minLength: 1
                      type: string
                    quota:
                      description: |-
                        Quota optionally narrows the token budget for this specific provider/model.
                        It may only be more restrictive than the enclosing scope's quota.
                      properties:
                        requestsPerMinute:
                          description: RequestsPerMinute caps the number of requests
                            in a rolling 60s window (RPM).
                          format: int64
                          minimum: 0
                          type: integer
                        tokensPerDay:
                          description: TokensPerDay caps tokens consumed per UTC calendar
                            day.
                          format: int64
                          minimum: 0
                          type: integer
                        tokensPerMinute:
                          description: TokensPerMinute caps tokens consumed in a rolling
                            60s window (TPM).
                          format: int64
                          minimum: 0
                          type: integer
                        tokensPerMonth:
                          description: TokensPerMonth caps tokens consumed per UTC
                            calendar month.
                          format: int64
                          minimum: 0
                          type: integer
                      type: object
                  required:
                  - model
                  - provider
                  type: object
                type: array
              priority:
                default: 0
                description: |-
                  Priority resolves overlapping policies that target the same workload; the highest value
                  wins. Defaults to 0.
                format: int32
                type: integer
              quota:
                description: |-
                  Quota is the token budget for the targeted scope. It may only be more restrictive than
                  the inherited namespace/cluster quota.
                properties:
                  requestsPerMinute:
                    description: RequestsPerMinute caps the number of requests in
                      a rolling 60s window (RPM).
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerDay:
                    description: TokensPerDay caps tokens consumed per UTC calendar
                      day.
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerMinute:
                    description: TokensPerMinute caps tokens consumed in a rolling
                      60s window (TPM).
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerMonth:
                    description: TokensPerMonth caps tokens consumed per UTC calendar
                      month.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              selector:
                description: |-
                  Selector targets workloads within this namespace. An empty/omitted selector makes
                  this the namespace-default policy. At most one namespace-default policy should exist
                  per namespace; if several do, the highest Priority wins.
                properties:
                  podSelector:
                    description: PodSelector matches pods by labels. Empty matches
                      all pods in the namespace.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  serviceAccounts:
                    description: ServiceAccounts restricts the policy to pods running
                      as any of these service accounts.
                    items:
                      type: string
                    type: array
                type: object
            type: object
          status:
            description: TokenPolicyStatus reports the observed and resolved state
              of a TokenPolicy.
            properties:
              boundCredentials:
                description: BoundCredentials lists the ModelCredentials resolved
                  for this policy's models.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the policy's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              effectiveModels:
                description: |-
                  EffectiveModels is the fully-resolved model permission set after applying the policy
                  hierarchy (cluster -> namespace -> workload).
                items:
                  description: EffectiveModel is a fully-resolved model permission
                    recorded in policy status.
                  properties:
                    action:
                      description: PermissionAction declares whether a ModelPermission
                        grants or revokes access.
                      enum:
                      - Allow
                      - Deny
                      type: string
                    credential:
                      description: Credential is the bound ModelCredential name, if
                        any.
                      type: string
                    model:
                      type: string
                    provider:
                      type: string
                    source:
                      description: Source identifies the policy (kind/namespace/name)
                        that contributed this entry.
                      type: string
                  required:
                  - action
                  - model
                  - provider
                  type: object
                type: array
              effectiveQuota:
                description: EffectiveQuota is the resolved (most restrictive) quota
                  across the hierarchy.
                properties:
                  requestsPerMinute:
                    description: RequestsPerMinute caps the number of requests in
                      a rolling 60s window (RPM).
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerDay:
                    description: TokensPerDay caps tokens consumed per UTC calendar
                      day.
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerMinute:
                    description: TokensPerMinute caps tokens consumed in a rolling
                      60s window (TPM).
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerMonth:
                    description: TokensPerMonth caps tokens consumed per UTC calendar
                      month.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
              gatewayRef:
                description: GatewayRef is the generated gateway artifact this policy
                  currently manages, if any.
                type: string
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              usage:
                description: Usage holds advisory consumption counters for this scope.
                properties:
                  lastUpdated:
                    description: LastUpdated is when these counters were last refreshed.
                    format: date-time
                    type: string
                  requestsMinute:
                    description: RequestsMinute is requests counted in the current
                      rolling minute.
                    format: int64
                    type: integer
                  tokensDay:
                    description: TokensDay is tokens consumed in the current UTC day.
                    format: int64
                    type: integer
                  tokensMinute:
                    description: TokensMinute is tokens consumed in the current rolling
                      minute.
                    format: int64
                    type: integer
                  tokensMonth:
                    description: TokensMonth is tokens consumed in the current UTC
                      month.
                    format: int64
                    type: integer
                  windowStart:
                    description: WindowStart is the start of the current accounting
                      window.
                    format: date-time
                    type: string
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
