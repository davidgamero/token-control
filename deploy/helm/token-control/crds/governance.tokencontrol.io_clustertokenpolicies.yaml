---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: clustertokenpolicies.governance.tokencontrol.io
spec:
  group: governance.tokencontrol.io
  names:
    categories:
    - governance
    - llm
    kind: ClusterTokenPolicy
    listKind: ClusterTokenPolicyList
    plural: clustertokenpolicies
    shortNames:
    - ctp
    singular: clustertokenpolicy
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.enforcement
      name: Enforcement
      type: string
    - jsonPath: .status.modelCount
      name: Models
      type: integer
    - jsonPath: .status.appliedNamespaces
      name: Namespaces
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterTokenPolicy is the Schema for the cluster-scoped, default LLM governance policy.
          It is the cluster analogue of LimitRange/ResourceQuota for LLM access.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ClusterTokenPolicySpec defines cluster-wide default LLM governance that applies to
              namespaces selected by NamespaceSelector. It is the broadest tier of the policy
              hierarchy: namespace TokenPolicies may only narrow (never widen) what is permitted here.
            properties:
              defaultCredentialRef:
                description: |-
                  DefaultCredentialRef is the fallback ModelCredential used when a model permission
                  does not name its own credential.
                properties:
                  name:
                    description: Name of the ModelCredential.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              enforcement:
                default: Enforce
                description: Enforcement is the default enforcement mode for selected
                  namespaces.
                enum:
                - Enforce
                - Audit
                - Disabled
                type: string
              gateway:
                description: Gateway configures default downstream gateway artifact
                  generation.
                properties:
                  targetRef:
                    description: TargetRef identifies the gateway route/backend to
                      which generated policy attaches.
                    properties:
                      group:
                        description: Group of the target, e.g. "gateway.networking.k8s.io"
                          or "aigateway.envoyproxy.io".
                        type: string
                      kind:
                        description: Kind of the target, e.g. "HTTPRoute", "AIGatewayRoute".
                        minLength: 1
                        type: string
                      name:
                        description: Name of the target object.
                        minLength: 1
                        type: string
                      namespace:
                        description: Namespace of the target. Defaults to the policy
                          namespace for namespaced policies.
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  type:
                    default: None
                    description: Type selects the gateway flavor. Defaults to None.
                    enum:
                    - None
                    - EnvoyAIGateway
                    - Kuadrant
                    type: string
                type: object
              models:
                description: |-
                  Models is the default model allowlist applied to selected namespaces. Workloads in
                  those namespaces may use only the union of Allowed models here (minus any Deny),
                  further narrowed by namespace/workload TokenPolicies.
                items:
                  description: |-
                    ModelPermission declares a provider/model combination and whether it is permitted.
                    Model supports glob patterns ("gpt-4o-*", "*"). Deny rules always win over Allow
                    rules at the same or a broader scope.
                  properties:
                    action:
                      default: Allow
                      description: Action is whether to Allow or Deny this provider/model.
                        Defaults to Allow.
                      enum:
                      - Allow
                      - Deny
                      type: string
                    credentialRef:
                      description: |-
                        CredentialRef binds a specific ModelCredential to this permission. When set, the
                        mutating webhook injects that credential for workloads using this model.
                      properties:
                        name:
                          description: Name of the ModelCredential.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    model:
                      description: Model is a model name or glob pattern, e.g. "gpt-4",
                        "gpt-4o-*", "*".
                      maxLength: 253
                      minLength: 1
                      type: string
                    provider:
                      description: Provider is the LLM provider identifier, e.g. "openai",
                        "anthropic", "bedrock", "vertex".
                      maxLength: 63
                      minLength: 1
                      type: string
                    quota:
                      description: |-
                        Quota optionally narrows the token budget for this specific provider/model.
                        It may only be more restrictive than the enclosing scope's quota.
                      properties:
                        requestsPerMinute:
                          description: RequestsPerMinute caps the number of requests
                            in a rolling 60s window (RPM).
                          format: int64
                          minimum: 0
                          type: integer
                        tokensPerDay:
                          description: TokensPerDay caps tokens consumed per UTC calendar
                            day.
                          format: int64
                          minimum: 0
                          type: integer
                        tokensPerMinute:
                          description: TokensPerMinute caps tokens consumed in a rolling
                            60s window (TPM).
                          format: int64
                          minimum: 0
                          type: integer
                        tokensPerMonth:
                          description: TokensPerMonth caps tokens consumed per UTC
                            calendar month.
                          format: int64
                          minimum: 0
                          type: integer
                      type: object
                  required:
                  - model
                  - provider
                  type: object
                type: array
              namespaceSelector:
                description: |-
                  NamespaceSelector limits which namespaces inherit these defaults. An empty selector
                  selects all namespaces. A namespace is governed by every ClusterTokenPolicy whose
                  selector it matches.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              quota:
                description: |-
                  Quota is the default per-namespace token budget. Namespace policies may set a
                  smaller, but not larger, quota.
                properties:
                  requestsPerMinute:
                    description: RequestsPerMinute caps the number of requests in
                      a rolling 60s window (RPM).
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerDay:
                    description: TokensPerDay caps tokens consumed per UTC calendar
                      day.
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerMinute:
                    description: TokensPerMinute caps tokens consumed in a rolling
                      60s window (TPM).
                    format: int64
                    minimum: 0
                    type: integer
                  tokensPerMonth:
                    description: TokensPerMonth caps tokens consumed per UTC calendar
                      month.
                    format: int64
                    minimum: 0
                    type: integer
                type: object
            type: object
          status:
            description: ClusterTokenPolicyStatus reports the observed state of a
              ClusterTokenPolicy.
            properties:
              appliedNamespaces:
                description: AppliedNamespaces lists namespaces currently matched
                  by NamespaceSelector.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the policy's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              modelCount:
                description: ModelCount is the number of model permission rules in
                  the spec.
                type: integer
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
