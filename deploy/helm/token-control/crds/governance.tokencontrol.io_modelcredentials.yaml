---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: modelcredentials.governance.tokencontrol.io
spec:
  group: governance.tokencontrol.io
  names:
    categories:
    - governance
    - llm
    kind: ModelCredential
    listKind: ModelCredentialList
    plural: modelcredentials
    shortNames:
    - mc
    singular: modelcredential
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.secretResolved
      name: SecretResolved
      type: boolean
    - jsonPath: .status.syncedNamespaces
      name: Synced
      priority: 1
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelCredential is the Schema for cluster-scoped, centrally-managed
          provider credentials.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelCredentialSpec binds an upstream provider credential to the set of namespaces and
              models permitted to use it. It exists so that workload teams declare intent ("use the
              openai credential") without each team managing and rotating their own Secret.
            properties:
              allowedNamespaces:
                description: AllowedNamespaces lists namespaces explicitly permitted
                  to bind this credential.
                items:
                  type: string
                type: array
              injection:
                description: Injection controls how the credential is delivered to
                  authorized workloads.
                properties:
                  envName:
                    description: |-
                      EnvName overrides the environment variable name used when Mode=Env. When empty a
                      provider-appropriate default is used (e.g. OPENAI_API_KEY, ANTHROPIC_API_KEY).
                    type: string
                  mode:
                    default: Env
                    description: Mode selects the injection mechanism. Defaults to
                      Env.
                    enum:
                    - None
                    - Env
                    - ProjectedVolume
                    type: string
                  mountPath:
                    description: MountPath overrides the mount path used when Mode=ProjectedVolume.
                    type: string
                type: object
              models:
                description: |-
                  Models lists glob patterns this credential is valid for. Empty means all models for
                  the provider.
                items:
                  type: string
                type: array
              namespaceSelector:
                description: |-
                  NamespaceSelector selects additional namespaces permitted to bind this credential.
                  A namespace is authorized if it is in AllowedNamespaces OR matches NamespaceSelector.
                  If both are empty, no namespace is authorized (deny by default).
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              provider:
                description: Provider this credential authenticates against, e.g.
                  "openai", "anthropic".
                minLength: 1
                type: string
              secretRef:
                description: SecretRef points to the single source-of-truth Secret
                  holding the API key.
                properties:
                  key:
                    description: Key within the Secret holding the API key/token.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the source Secret.
                    minLength: 1
                    type: string
                  namespace:
                    description: Namespace of the source Secret. Defaults to the operator
                      namespace when empty.
                    type: string
                required:
                - key
                - name
                type: object
            required:
            - provider
            - secretRef
            type: object
          status:
            description: ModelCredentialStatus reports the observed state of a ModelCredential.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the credential's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              referencingPolicies:
                description: ReferencingPolicies lists policies (namespace/name) that
                  reference this credential.
                items:
                  type: string
                type: array
              secretResolved:
                description: SecretResolved is true when the source Secret and key
                  were found.
                type: boolean
              syncedNamespaces:
                description: SyncedNamespaces lists namespaces into which the credential
                  Secret has been replicated.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
