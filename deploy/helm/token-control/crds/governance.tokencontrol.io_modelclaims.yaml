---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: modelclaims.governance.tokencontrol.io
spec:
  group: governance.tokencontrol.io
  names:
    categories:
    - governance
    - llm
    kind: ModelClaim
    listKind: ModelClaimList
    plural: modelclaims
    shortNames:
    - mcl
    singular: modelclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.purpose
      name: Purpose
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ModelClaim is the Schema for a workload's strongly-typed, validated declaration of the
          models it intends to call. It replaces the self-asserted governance.tokencontrol.io/models
          pod annotation: a claim is a first-class, RBAC-controlled, schema-validated object that the
          webhook resolves at create time and the controller binds against the policy hierarchy.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelClaimSpec is a workload team's declaration of intent: "these workloads will call these
              models". It is the bottom-up counterpart to the top-down grant expressed by
              ClusterTokenPolicy/TokenPolicy -- the LLM analogue of a PersistentVolumeClaim against the
              available supply. The claim is bound only insofar as the policy hierarchy permits the
              requested models; the controller records the per-model verdict in status.
            properties:
              models:
                description: Models is the set of provider/model combinations the
                  covered workloads intend to call.
                items:
                  description: ModelRequest is a single provider/model a workload
                    declares it intends to call.
                  properties:
                    credentialRef:
                      description: |-
                        CredentialRef optionally requests a specific ModelCredential for this model. It is a
                        preference only: the policy hierarchy still authorizes the model and a policy that binds
                        its own credential takes precedence. Used as the fallback credential when the resolved
                        policy does not name one.
                      properties:
                        name:
                          description: Name of the ModelCredential.
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                    model:
                      description: Model is the concrete model name the workload will
                        call, e.g. "gpt-4o-mini".
                      maxLength: 253
                      minLength: 1
                      type: string
                    provider:
                      description: Provider is the LLM provider identifier, e.g. "openai",
                        "anthropic", "bedrock".
                      maxLength: 63
                      minLength: 1
                      type: string
                  required:
                  - model
                  - provider
                  type: object
                minItems: 1
                type: array
              purpose:
                description: Purpose is a free-form description of why these models
                  are needed, recorded for auditing.
                maxLength: 512
                type: string
              selector:
                description: |-
                  Selector identifies the workloads in this namespace that the claim covers. An empty or
                  omitted selector covers every workload in the namespace. Binding the declaration to
                  workload identity (service accounts / pod labels) rather than a pod-authored annotation
                  is what makes it strongly typed and tamper-resistant: pods declare nothing.
                properties:
                  podSelector:
                    description: PodSelector matches pods by labels. Empty matches
                      all pods in the namespace.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                  serviceAccounts:
                    description: ServiceAccounts restricts the policy to pods running
                      as any of these service accounts.
                    items:
                      type: string
                    type: array
                type: object
            required:
            - models
            type: object
          status:
            description: ModelClaimStatus reports the resolved binding state of a
              ModelClaim.
            properties:
              boundCredentials:
                description: BoundCredentials lists the distinct ModelCredentials
                  resolved for the permitted models.
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the latest available observations
                  of the claim's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the .metadata.generation last reconciled.
                format: int64
                type: integer
              phase:
                description: |-
                  Phase summarizes binding: Bound when every requested model is permitted, Denied when any
                  requested model is refused by the effective policy, Pending before first resolution.
                enum:
                - Pending
                - Bound
                - Denied
                type: string
              resolvedModels:
                description: |-
                  ResolvedModels is the per-request verdict (Allow/Deny, bound credential, denying source)
                  computed from the policy hierarchy for the claim's scope.
                items:
                  description: EffectiveModel is a fully-resolved model permission
                    recorded in policy status.
                  properties:
                    action:
                      description: PermissionAction declares whether a ModelPermission
                        grants or revokes access.
                      enum:
                      - Allow
                      - Deny
                      type: string
                    credential:
                      description: Credential is the bound ModelCredential name, if
                        any.
                      type: string
                    model:
                      type: string
                    provider:
                      type: string
                    source:
                      description: Source identifies the policy (kind/namespace/name)
                        that contributed this entry.
                      type: string
                  required:
                  - action
                  - model
                  - provider
                  type: object
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
