apiVersion: v2
name: token-control
description: |
  Kubernetes-native governance for LLM/model access: namespace- and workload-scoped
  allowlists, token quotas, and centrally-managed provider credentials, enforced at
  admission time (no proxy in the request hot path) with optional downstream gateway
  rate-limit artifact generation (Envoy AI Gateway / Kuadrant).
type: application
# Chart version; bump on chart changes.
version: 0.1.0
# Version of the token-control manager image this chart deploys by default.
appVersion: "0.1.0"
kubeVersion: ">=1.21.0-0"
keywords:
  - llm
  - ai
  - governance
  - finops
  - admission-webhook
  - rate-limit
  - tokens
home: https://github.com/token-control/token-control
sources:
  - https://github.com/token-control/token-control
maintainers:
  - name: token-control authors
annotations:
  category: Security
