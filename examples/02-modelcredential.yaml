# Centrally-managed provider credential.
#
# The source Secret is the single source of truth and lives in the operator namespace. The
# controller replicates it (never the raw value in git) into each authorized namespace as a
# Secret named "tc-cred-<name>", owned by this ModelCredential so it is garbage-collected on
# delete and re-synced on drift. Workload teams never see or manage the key material; the
# mutating webhook injects it for them.
#
# First create the source Secret (kept only in the operator namespace):
#
#   kubectl -n token-control-system create secret generic openai \
#     --from-literal=apiKey=sk-REDACTED
#
apiVersion: governance.tokencontrol.io/v1alpha1
kind: ModelCredential
metadata:
  name: openai
spec:
  provider: openai

  # Glob list of models this credential is valid for. Empty = all models for the provider.
  models:
    - "gpt-4o-*"

  # The single source-of-truth Secret. Namespace defaults to the operator namespace.
  secretRef:
    name: openai
    key: apiKey

  # A namespace is authorized to bind this credential if it is listed here OR matches the
  # selector below. If both are empty, NO namespace is authorized (deny by default).
  allowedNamespaces:
    - team-a
  namespaceSelector:
    matchLabels:
      tokencontrol.io/team: ml-platform

  # How the credential is delivered to authorized workloads. Default is an env var with a
  # provider-appropriate name (OPENAI_API_KEY here).
  injection:
    mode: Env
    # envName: OPENAI_API_KEY        # override the default env var name
    # mode: ProjectedVolume          # alternatively mount it as a file
    # mountPath: /var/run/secrets/tokencontrol/openai

  # Capacity planning (supply side). Declare the total throughput this provider key can
  # actually deliver -- the LLM analogue of a Node's allocatable capacity. The controller
  # sums the budgets of every policy that binds this credential and reports, in status:
  #   allocated  -- committed demand (sum of referencing TokenPolicy/ClusterTokenPolicy quotas)
  #   available  -- capacity - allocated (floored at zero)
  # and sets the Oversubscribed condition (+ tokencontrol_credential_oversubscribed metric)
  # when commitments exceed capacity. This is advisory planning only; it does not rate-limit
  # requests (live enforcement remains the gateway's job).
  capacity:
    tokensPerMinute: 1000000
    requestsPerMinute: 10000

